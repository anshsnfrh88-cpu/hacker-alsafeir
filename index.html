<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER ALSAFEIR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Matrix background canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
            backdrop-filter: blur(5px);
            max-width: 90%;
        }

        /* Large glowing skull */
        .skull {
            font-size: 110px;
            line-height: 1;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px #00ff66);
            animation: pulse 1.8s infinite ease-in-out;
            user-select: none;
        }

        /* Title text */
        .title {
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66, 0 0 40px #00ff66;
            letter-spacing: 2px;
            margin-top: 10px;
            animation: glitch 1s infinite;
        }

        .subtitle {
            font-size: 16px;
            color: #00ff66;
            margin-top: 15px;
            opacity: 0.85;
            letter-spacing: 3px;
        }

        /* Pulse animation */
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px #00ff66); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px #00ff66); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px #00ff66); }
        }

        /* Glitch animation */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container">
        <div class="skull">💀</div>
        <div class="title">HACKER ALSAFEIR</div>
        <div class="subtitle">SYSTEM HACKED // ACCESS GRANTED</div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01101001 01001000 01100001 01100011 01101011 01100101 01100100 0123456789ABCDEF';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array.from({ length: columns }).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(draw, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
